apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: autonomous-business-os
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
    spec:
      containers:
        - image: REGION-docker.pkg.dev/PROJECT/business-os/api:latest
          ports:
            - containerPort: 8000
          env:
            - name: ENVIRONMENT
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: business-os-database-url
                  key: latest
            - name: ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: business-os-admin-api-key
                  key: latest
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 6
