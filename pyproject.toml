[project]
name = "autonomous-business-os"
version = "0.1.0"
description = "Autonomous Business Operating System with multi-agent orchestration."
requires-python = ">=3.11"
dependencies = [
  "apscheduler==3.11.2",
  "email-validator==2.3.0",
  "fastapi==0.124.4",
  "httpx==0.28.1",
  "jinja2==3.1.6",
  "prometheus-client==0.21.1",
  "pydantic==2.12.5",
  "pydantic-settings==2.13.1",
  "python-dotenv==1.2.2",
  "python-multipart==0.0.26",
  "sqlalchemy==2.0.48",
  "structlog==24.4.0",
  "tenacity==8.5.0",
  "uvicorn[standard]==0.33.0"
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "ruff==0.8.4"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
